[tool.pytest.ini_options]
testpaths = ["orchestrator"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP042"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
