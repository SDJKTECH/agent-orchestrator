      stateBadge(STATUS_TEXT, task.status),
      task.current_stage && ACTIVE.has(task.status) ? el("span", { text: task.current_stage }) : null,
      task.blocked_by.length && task.status === "blocked" ? el("span", { text: `waiting for ${task.blocked_by.join(", ")}` }) : null,
      el("span", {}, el("strong", { "data-task-start": span.start, "data-task-end": span.end, text: "–" })),
      el("span", { text: fmtCost(task.usage.cost_usd) }));
    const prHref = awaitingMerge(task) ? safeUrl(task.pull_request_url) : null;
    actions = el("div", { class: "wact" },
      prHref ? el("a", { class: "btnlink", href: prHref, target: "_blank", rel: "noopener noreferrer", text: "Merge PR" }) : null,
      el("button", { type: "button", text: "Details", "aria-label": `Details of ${taskLabel(task)}`, onclick: () => openDrawer(task.id) }));
  }

  return el("div", {
    class: `wrow depth-${Math.min(depth, 2)} ${container ? `container ${typeClass(node.type)}` : "leaf"}`
      + (task && ACTIVE.has(task.status) ? " is-running" : ""),
    style: lane ? `--lane:${lane}` : null,
  }, name, middle, stats, actions);
}

function renderWork(data, visible) {
  const box = document.getElementById("work");
  const show = new Set(visible.map((task) => task.id));
  const filtering = visible.length < data.tasks.length;
  const signature = JSON.stringify([
    visible.map((t) => [t.id, t.status, t.current_stage, t.board_column, t.usage.cost_usd, t.pull_request_url,
      t.blocked_by, t.stages.map((s) => s.state)]),
    [...state.collapsed], data.work_items.map((w) => [w.key, w.title]), filtering]);
  if (box.dataset.signature === signature) return;
  box.dataset.signature = signature;

  const { roots, loose } = workModel(data);
  const rows = [];
  const walk = (node, depth) => {
    if (filtering && !rollup(node, show).total) return;
    rows.push(workRow(node, depth, show));
    if (!state.collapsed.has(node.key)) node.children.forEach((child) => walk(child, depth + 1));
  };
  roots.forEach((root) => walk(root, 0));

  const looseShown = loose.filter((node) => show.has(node.task.id));
  if (looseShown.length) {
    const group = { key: "__loose", type: "Other", title: `Tasks without a Jira parent (${looseShown.length})`,
      url: null, task: null, children: looseShown };
    rows.push(el("div", { class: "wrow container" },
      el("div", { class: "wname" },
        el("button", { type: "button", class: "twisty", "aria-expanded": String(!state.collapsed.has("__loose")),
          "aria-label": `${state.collapsed.has("__loose") ? "Expand" : "Collapse"} tasks without a Jira parent`,
          onclick: () => toggleNode("__loose"), text: state.collapsed.has("__loose") ? "▸" : "▾" }),
        el("span", { class: "wtitle", text: group.title })),
      el("span", { class: "meta", text: "GitHub issues and tasks imported before the hierarchy existed" }),
      el("span"), el("span")));
    if (!state.collapsed.has("__loose")) looseShown.forEach((node) => rows.push(workRow(node, 1, show)));
  }

  box.replaceChildren(...(rows.length ? rows : [el("div", { class: "empty", text: data.tasks.length
    ? "No tasks match this filter."
    : "No tasks yet. Move a Jira issue to To Do and it appears here with its Epic and Story." })]));
  tickDurations();
}

/* ---------- data loading ---------- */
function setLive(kind, text) {
  document.getElementById("live-dot").className = "dot" + (kind ? ` ${kind}` : "");
  document.getElementById("live-text").textContent = text;
}

// An older server may not send the newer fields; treat them as empty.
function normalize(data) {
  data.work_items = data.work_items || [];
  data.activity = data.activity || [];
  for (const task of data.tasks) task.hierarchy = task.hierarchy || [];
}

async function refresh() {
  try {
    const response = await fetch("/dashboard/overview", { cache: "no-store" });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    state.data = await response.json();
    normalize(state.data);
    state.failures = 0;
    detectChanges(state.data);
    if (!state.viewChosen && !state.autoViewed && state.data.work_items.length) {
      // First visit: show the Epic > Story tree whenever Jira hierarchy exists.
      state.autoViewed = true;
      setView("work", false);
    }
    render();
    openFromHash();
    setLive(state.live ? "" : "paused",
      state.live ? `Live · updated ${new Date().toLocaleTimeString()}` : "Updates paused");
  } catch (error) {
    state.failures += 1;
    setLive("stale", `Disconnected (${error.message}) – retrying`);
  }
}

function schedule() {
  clearInterval(state.timer);
  if (state.live) state.timer = setInterval(() => { if (!document.hidden) refresh(); }, POLL_MS);
}

document.getElementById("toggle-live").addEventListener("click", (event) => {
  state.live = !state.live;
  event.target.textContent = state.live ? "Pause updates" : "Resume updates";
  setLive(state.live ? "" : "paused", state.live ? "Live" : "Updates paused");
  schedule();
  if (state.live) refresh();
});

document.getElementById("filter").addEventListener("change", render);
document.getElementById("project-filter").addEventListener("change", render);

document.getElementById("sync").addEventListener("click", async (event) => {
  const button = event.target;
  button.disabled = true;
  try {
    let imported = 0, skipped = 0;
    // Issues are routed to their own milestone, so syncing through one is enough.
    for (const milestone of state.data.milestones.slice(0, 1)) {
      const response = await fetch(`/milestones/${milestone.id}/sync`, { method: "POST" });
      const body = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(body.detail || `HTTP ${response.status}`);
      imported += body.imported.length;
      skipped += body.skipped_issue_numbers.length;
    }
    toast(`Imported ${imported} new issue(s), ${skipped} already known.`, "info");
  } catch (error) {
    toast(`Sync failed: ${error.message}`);
  }
  button.disabled = false;
  refresh();
});

document.getElementById("search").addEventListener("input", (event) => {
  state.query = event.target.value;
  render();
});
document.getElementById("view-work").addEventListener("click", () => setView("work"));
document.getElementById("view-cards").addEventListener("click", () => setView("cards"));
document.getElementById("view-board").addEventListener("click", () => setView("board"));
document.getElementById("theme").addEventListener("click", cycleTheme);
document.getElementById("drawer-close").addEventListener("click", closeDrawer);
document.getElementById("backdrop").addEventListener("click", closeDrawer);

document.addEventListener("keydown", (event) => {
  const active = document.activeElement;
  const typing = active && /^(INPUT|SELECT|TEXTAREA)$/.test(active.tagName);
  if (event.key === "Escape") {
    if (state.drawer) closeDrawer();
    else if (typing) active.blur();
  } else if (event.key === "/" && !typing) {
    event.preventDefault();
    document.getElementById("search").focus();
  } else if (!typing && !state.drawer && !event.ctrlKey && !event.metaKey && !event.altKey) {
    const view = { "1": "work", "2": "cards", "3": "board" }[event.key];
    if (view) setView(view);
  }
});

function openFromHash() {
  if (state.opened) return;
  state.opened = true;
  const match = /^#task-(\d+)$/.exec(location.hash);
  if (match) openDrawer(Number(match[1]));
}

{
  const forced = new URLSearchParams(location.search).get("theme");
  applyTheme(forced === "dark" || forced === "light" ? forced : stored("theme", "auto"));
  // ?view=board or ?view=cards overrides the remembered view.
  const asked = new URLSearchParams(location.search).get("view") || stored("view", "");
  state.viewChosen = Boolean(asked);
  try { state.collapsed = new Set(JSON.parse(stored("collapsed", '["__loose"]'))); } catch { state.collapsed = new Set(["__loose"]); }
  setView(["board", "work"].includes(asked) ? asked : "cards", false);
}

setInterval(tickDurations, 1000);
setInterval(() => drawerRender(false), 5000);
refresh();
schedule();
</script>
</body>
</html>
