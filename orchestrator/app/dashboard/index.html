<!doctype html>
<!-- Live monitoring dashboard: a single page that polls /dashboard/overview.
     Shows each task's stages, cost, milestones and the pause/resume/cancel controls. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Orchestrator Dashboard</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --ink-3: #898781;
    --line: #e1e0d9;
    --line-strong: #c3c2b7;
    --ring: rgba(11, 11, 11, 0.10);
    --accent: #2a78d6;
    --accent-soft: #cde2fb;
    --good: #0ca30c;
    --warning: #fab219;
    --serious: #ec835a;
    --critical: #d03b3b;
    --good-text: #006300;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page: #0d0d0d;
      --surface: #1a1a19;
      --ink: #f0efec;
      --ink-2: #c3c2b7;
      --ink-3: #898781;
      --line: #2c2c2a;
      --line-strong: #383835;
      --ring: rgba(255, 255, 255, 0.10);
      --accent: #3987e5;
      --accent-soft: #184f95;
      --good-text: #0ca30c;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --ink: #f0efec;
    --ink-2: #c3c2b7;
    --ink-3: #898781;
    --line: #2c2c2a;
    --line-strong: #383835;
    --ring: rgba(255, 255, 255, 0.10);
    --accent: #3987e5;
    --accent-soft: #184f95;
    --good-text: #0ca30c;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  a { color: var(--accent); }
  a:focus-visible, button:focus-visible, select:focus-visible, summary:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  main { max-width: 1120px; margin: 0 auto; padding: 16px; }

  header.top {
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 16px;
  }
  header.top h1 { font-size: 20px; margin: 0; flex: 1 1 220px; }
  header.top .meta { color: var(--ink-2); font-size: 13px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

  button, select {
    font: inherit; color: var(--ink); background: var(--surface);
    border: 1px solid var(--line-strong); border-radius: 6px; padding: 5px 12px; cursor: pointer;
  }
  button:hover:not(:disabled) { background: var(--line); }
  button:disabled { color: var(--ink-3); cursor: not-allowed; }
  button.danger { border-color: var(--critical); }
  button.primary { border-color: var(--accent); }

  .live { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); }
  .dot.stale { background: var(--critical); }
  .dot.paused { background: var(--ink-3); }

  .tiles {
    display: grid; gap: 12px; margin-bottom: 16px;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  }
  .tile {
    background: var(--surface); border: 1px solid var(--ring); border-radius: 10px; padding: 12px 14px;
  }
  .tile .label { color: var(--ink-2); font-size: 12px; }
  .tile .value { font-size: 26px; font-weight: 600; margin: 2px 0; }
  .tile .sub { color: var(--ink-2); font-size: 12px; }

  .milestones {
    background: var(--surface); border: 1px solid var(--ring); border-radius: 10px;
    padding: 10px 14px; margin-bottom: 16px;
  }
  .milestones h2 { font-size: 14px; margin: 0 0 6px; color: var(--ink-2); }
  .ms-row {
    display: grid; grid-template-columns: minmax(180px, 2fr) 1fr 1fr 1fr; gap: 4px 12px;
    align-items: center; padding: 5px 0; border-top: 1px solid var(--line); font-size: 13px;
  }
  .ms-row .code { font-weight: 600; }
  .ms-row .num { color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .ms-bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .ms-bar > span { display: block; height: 100%; background: var(--good); }
  .pj-row {
    display: grid; grid-template-columns: minmax(160px, 1.4fr) 1fr 1fr 1.2fr; gap: 4px 12px;
    align-items: center; padding: 6px 0; border-top: 1px solid var(--line); font-size: 13px;
  }
  .pj-row .name { font-weight: 600; }
  .pj-cols { display: flex; flex-wrap: wrap; gap: 4px; grid-column: 1 / -1; }
  .pj-cols .chip { font-weight: 500; }
  @media (max-width: 720px) { .pj-row { grid-template-columns: 1fr 1fr; } }
  .chip {
    font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 999px;
    border: 1px solid var(--line-strong); color: var(--ink-2); white-space: nowrap;
  }
  @media (max-width: 720px) { .ms-row { grid-template-columns: 1fr 1fr; } }

  .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  .filters .count { color: var(--ink-2); font-size: 13px; margin-left: auto; }

  .card {
    background: var(--surface); border: 1px solid var(--ring); border-radius: 10px;
    padding: 14px; margin-bottom: 12px;
  }
  .card-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
  .card-head .title { font-weight: 600; font-size: 15px; flex: 1 1 260px; min-width: 0; overflow-wrap: anywhere; }
  .card-head .id { color: var(--ink-2); font-weight: 400; }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; }

  .badge {
    display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px;
    border: 1px solid var(--line-strong); font-size: 12px; font-weight: 600; white-space: nowrap;
  }
  .icon { font-weight: 700; display: inline-block; width: 1.1em; text-align: center; }
  .st-done .icon, .st-completed .icon { color: var(--good); }
  .st-running .icon, .st-starting .icon, .st-verifying .icon { color: var(--accent); }
  .st-paused .icon { color: var(--warning); }
  .st-failed .icon, .st-rejected .icon { color: var(--critical); }
  .st-cancelled .icon, .st-skipped .icon, .st-pending .icon, .st-queued .icon, .st-blocked .icon { color: var(--ink-3); }
  .spin { animation: spin 1.2s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }

  .stepper {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 14px 0 10px; padding: 0; list-style: none;
  }
  .step {
    border: 1px solid var(--line); border-top-width: 3px; border-radius: 8px; padding: 6px 8px; min-width: 0;
  }
  .step.st-done { border-top-color: var(--good); }
  .step.st-running { border-top-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .step.st-paused { border-top-color: var(--warning); }
  .step.st-failed, .step.st-rejected { border-top-color: var(--critical); }
  .step.st-cancelled, .step.st-skipped, .step.st-pending { border-top-color: var(--line-strong); }
  .step .name { font-weight: 600; }
  .step .state { color: var(--ink-2); font-size: 12px; }
  .step .detail { color: var(--ink-3); font-size: 11px; overflow-wrap: anywhere; }
  @media (max-width: 720px) { .stepper { grid-template-columns: repeat(2, 1fr); } }

  .facts { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--ink-2); font-size: 13px; }
  .facts strong { color: var(--ink); font-weight: 600; }

  details { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; }
  summary { cursor: pointer; color: var(--ink-2); font-weight: 600; }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 13px; }
  th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--ink-2); font-weight: 600; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  ul.checks { list-style: none; margin: 8px 0 0; padding: 0; }
  ul.checks li { padding: 3px 0; }
  pre.output {
    max-height: 260px; overflow: auto; background: var(--page); border: 1px solid var(--line);
    border-radius: 6px; padding: 8px; font-size: 12px; white-space: pre-wrap;
  }
  .empty { text-align: center; color: var(--ink-2); padding: 40px 12px; }

  #toast {
    position: fixed; right: 16px; bottom: 16px; max-width: 420px; background: var(--surface);
    border: 1px solid var(--critical); border-radius: 8px; padding: 10px 14px; display: none;
    box-shadow: 0 4px 16px var(--ring);
  }
  #toast.info { border-color: var(--accent); }
  #toast.show { display: block; }

  /* ---------- v2: controls, live strip, insights, board, drawer ---------- */
  :root {
    --role-builder: #2a78d6; --role-tester: #178f80; --role-reviewer: #8a5cd6;
    --s-wait: #898781; --s-queued: #c3a000; --s-work: #2a78d6; --s-done: #0ca30c; --s-fail: #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      --role-builder: #5aa0f0; --role-tester: #3fc0ae; --role-reviewer: #b08cf0;
      --s-queued: #e0b830; --s-work: #4a95ec; --s-fail: #e86a6a;
    }
  }
  :root[data-theme="dark"] {
    --role-builder: #5aa0f0; --role-tester: #3fc0ae; --role-reviewer: #b08cf0;
    --s-queued: #e0b830; --s-work: #4a95ec; --s-fail: #e86a6a;
  }
  header.top h1 { display: flex; align-items: center; gap: 10px; }
  header.top h1 .logo {
    width: 28px; height: 28px; border-radius: 8px; display: inline-grid; place-items: center;
    background: linear-gradient(135deg, var(--role-builder), var(--role-reviewer)); color: #fff; font-size: 15px;
  }
  input[type="search"] {
    font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line-strong);
    border-radius: 6px; padding: 5px 10px; min-width: 200px;
  }
  .seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 6px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; background: transparent; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .seg button + button { border-left: 1px solid var(--line-strong); }
  kbd {
    font: 11px ui-monospace, Consolas, monospace; border: 1px solid var(--line-strong); border-bottom-width: 2px;
    border-radius: 4px; padding: 0 5px; color: var(--ink-2);
  }

  .panel {
    background: var(--surface); border: 1px solid var(--ring); border-radius: 10px;
    padding: 10px 14px; margin-bottom: 16px;
  }
  .panel h2 { font-size: 14px; margin: 0 0 8px; color: var(--ink-2); display: flex; align-items: center; gap: 8px; }
  .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--s-work); animation: pulse 1.6s ease-out infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--s-work) 60%, transparent); } 100% { box-shadow: 0 0 0 9px transparent; } }
  @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }

  .agents-now { display: flex; flex-wrap: wrap; gap: 8px; }
  .agent-chip {
    display: inline-flex; align-items: center; gap: 8px; padding: 5px 10px 5px 6px; cursor: pointer;
    border: 1px solid var(--line-strong); border-radius: 999px; background: var(--page); font: inherit; color: var(--ink);
  }
  .agent-chip:hover { background: var(--line); }
  .roundel {
    width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center; flex: none;
    color: #fff; font-size: 11px; font-weight: 700; background: var(--ink-3);
  }
  .roundel.builder { background: var(--role-builder); }
  .roundel.tester { background: var(--role-tester); }
  .roundel.reviewer { background: var(--role-reviewer); }
  .agent-chip .meta { font-size: 12px; }
  .agent-chip .elapsed { font-variant-numeric: tabular-nums; font-weight: 600; }

  .insights { display: grid; gap: 16px; grid-template-columns: 1.2fr 1fr; margin-bottom: 16px; }
  @media (max-width: 820px) { .insights { grid-template-columns: 1fr; } }
  .insights .panel { margin: 0; }
  .statusbar { display: flex; height: 14px; border-radius: 7px; overflow: hidden; background: var(--line); gap: 2px; }
  .statusbar > span { display: block; min-width: 4px; transition: flex-grow 0.4s; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; }
  .legend button { border: 0; background: transparent; padding: 0; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
  .legend button:hover:not(:disabled) { background: transparent; text-decoration: underline; }
  .swatch { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .rolebar { display: grid; grid-template-columns: 74px 1fr auto; gap: 4px 10px; align-items: center; font-size: 13px; padding: 3px 0; }
  .rolebar .track { height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; }
  .rolebar .track > span { display: block; height: 100%; border-radius: 5px; }
  .rolebar .num { color: var(--ink-2); font-variant-numeric: tabular-nums; text-align: right; }

  .flash { animation: flash 1.6s ease-out; }
  @keyframes flash { 0% { box-shadow: 0 0 0 3px var(--accent); } 100% { box-shadow: 0 0 0 0 transparent; } }
  @media (prefers-reduced-motion: reduce) { .flash { animation: none; } }
  .card.is-running { border-color: color-mix(in srgb, var(--s-work) 55%, var(--ring)); }
  .card .title button.linklike { all: unset; cursor: pointer; font-weight: 600; }
  .card .title button.linklike:hover { text-decoration: underline; }
  .card .title button.linklike:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .board { display: grid; gap: 12px; grid-template-columns: repeat(5, minmax(200px, 1fr)); overflow-x: auto; padding-bottom: 8px; }
  .lane { background: var(--surface); border: 1px solid var(--ring); border-radius: 10px; padding: 8px; min-height: 120px; }
  .lane h3 { margin: 2px 4px 8px; font-size: 13px; display: flex; align-items: center; gap: 8px; color: var(--ink-2); }
  .lane h3 .count { margin-left: auto; font-weight: 600; }
  .mini {
    display: block; width: 100%; text-align: left; margin-bottom: 8px; padding: 8px 10px; border-radius: 8px;
    background: var(--page); border: 1px solid var(--line); border-left: 4px solid var(--lane, var(--line-strong));
  }
  .mini:hover { background: var(--line); }
  .mini .t { font-weight: 600; overflow-wrap: anywhere; }
  .mini .m { color: var(--ink-2); font-size: 12px; margin-top: 3px; display: flex; flex-wrap: wrap; gap: 4px 10px; }
  .pips { display: flex; gap: 3px; margin-top: 6px; }
  .pips i { flex: 1; height: 4px; border-radius: 2px; background: var(--line-strong); }
  .pips i.st-done { background: var(--good); }
  .pips i.st-running { background: var(--accent); }
  .pips i.st-failed, .pips i.st-rejected { background: var(--critical); }
  .pips i.st-paused { background: var(--warning); }

  #backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.4); display: none; z-index: 20; }
  #backdrop.show { display: block; }
  #drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(720px, 100vw); background: var(--page); z-index: 30;
    border-left: 1px solid var(--line-strong); box-shadow: -8px 0 32px var(--ring); display: flex; flex-direction: column;
    transform: translateX(105%); transition: transform 0.22s ease-out; visibility: hidden;
  }
  #drawer.open { transform: none; visibility: visible; }
  @media (prefers-reduced-motion: reduce) { #drawer { transition: none; } }
  #drawer .bar { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--surface); }
  #drawer .bar h2 { font-size: 16px; margin: 0; flex: 1; overflow-wrap: anywhere; }
  #drawer-body { overflow-y: auto; padding: 14px 16px 32px; flex: 1; }
  #drawer h3 { font-size: 13px; color: var(--ink-2); margin: 18px 0 8px; text-transform: uppercase; letter-spacing: 0.04em; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  button.chip { cursor: pointer; background: transparent; }
  button.chip:hover { background: var(--line); }

  .gantt { position: relative; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 8px 10px; }
  .gantt .row { position: relative; height: 24px; margin: 3px 0; }
  .gantt .span {
    position: absolute; top: 2px; bottom: 2px; border-radius: 5px; min-width: 6px; color: #fff; font-size: 11px;
    padding: 0 6px; overflow: hidden; white-space: nowrap; display: flex; align-items: center; cursor: pointer; border: 0;
  }
  .gantt .span.builder { background: var(--role-builder); }
  .gantt .span.tester { background: var(--role-tester); }
  .gantt .span.reviewer { background: var(--role-reviewer); }
  .gantt .span.live { animation: pulse-bar 1.6s ease-in-out infinite; }
  @keyframes pulse-bar { 50% { opacity: 0.65; } }
  @media (prefers-reduced-motion: reduce) { .gantt .span.live { animation: none; } }
  .gantt .axis { display: flex; justify-content: space-between; color: var(--ink-3); font-size: 11px; margin-top: 4px; }

  .run { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); margin-bottom: 8px; padding: 8px 12px; }
  .run.target { border-color: var(--accent); }
  .run > summary { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; list-style: none; }
  .run > summary::-webkit-details-marker { display: none; }
  .run > summary .grow { flex: 1; }
  .run dl { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px 16px; margin: 12px 0 8px; }
  .run dt { color: var(--ink-3); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
  .run dd { margin: 1px 0 0; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .run pre.output { max-height: 320px; }
  .desc { white-space: pre-wrap; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; max-height: 240px; overflow: auto; }
  .hint { color: var(--ink-3); font-size: 12px; margin: 14px 0 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header class="top">
    <h1><span class="logo" aria-hidden="true">&#9881;</span>Agent Orchestrator</h1>
    <div class="meta" id="repo"></div>
    <div class="toolbar">
      <span class="live meta" aria-live="polite"><span class="dot paused" id="live-dot"></span><span id="live-text">Connecting…</span></span>
      <input type="search" id="search" placeholder="Search tasks (press /)" aria-label="Search tasks">
      <span class="seg" role="group" aria-label="View">
        <button id="view-cards" type="button" aria-pressed="true">Cards</button>
        <button id="view-board" type="button" aria-pressed="false">Board</button>
      </span>
      <button id="theme" type="button" title="Switch between automatic, light and dark">Theme: auto</button>
      <button id="toggle-live" type="button">Pause updates</button>
      <button id="sync" type="button" class="primary" hidden>Sync issues</button>
    </div>
  </header>

  <section class="tiles" aria-label="Summary" id="tiles"></section>

  <section class="panel" id="live-panel" aria-label="Agents working now" hidden></section>
  <div class="insights">
    <section class="panel" id="status-panel" aria-label="Task flow"></section>
    <section class="panel" id="roles-panel" aria-label="Cost by agent"></section>
  </div>

  <section class="milestones" id="projects" aria-label="Projects" hidden></section>
  <section class="milestones" id="milestones" aria-label="Milestones" hidden></section>

  <div class="filters">
    <label for="project-filter">Project</label>
    <select id="project-filter"><option value="">All projects</option></select>
    <label for="filter">Show</label>
    <select id="filter">
      <option value="all">All tasks</option>
      <option value="active">Active (running, paused, verifying)</option>
      <option value="queued">Queued</option>
      <option value="blocked">Waiting for other tasks</option>
      <option value="completed">Completed</option>
      <option value="failed">Failed or cancelled</option>
    </select>
    <span class="count" id="count"></span>
  </div>

  <section id="tasks" aria-label="Tasks"></section>
  <section id="board" class="board" aria-label="Task board" hidden></section>
</main>
<div id="backdrop"></div>
<aside id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" aria-hidden="true">
  <div class="bar">
    <h2 id="drawer-title">Task</h2>
    <button id="drawer-close" type="button">Close</button>
  </div>
  <div id="drawer-body"></div>
</aside>
<div id="toast" role="status" aria-live="assertive"></div>

<script>
"use strict";

const POLL_MS = 2000;
{
  // ?theme=dark or ?theme=light overrides the OS setting.
  const theme = new URLSearchParams(location.search).get("theme");
  if (theme === "dark" || theme === "light") document.documentElement.dataset.theme = theme;
}
const STATE_TEXT = {
  done: ["✓", "Done"], running: ["◐", "Running"], paused: ["⏸", "Paused"],
  failed: ["✕", "Failed"], rejected: ["✕", "Rejected"], cancelled: ["⊘", "Cancelled"],
  skipped: ["–", "Skipped"], pending: ["○", "Pending"],
};
const STATUS_TEXT = {
  blocked: ["⏸", "Waiting"], queued: ["○", "Queued"], starting: ["◐", "Starting"], running: ["◐", "Running"],
  verifying: ["◐", "Verifying"], paused: ["⏸", "Paused"], completed: ["✓", "Completed"],
  failed: ["✕", "Failed"], cancelled: ["⊘", "Cancelled"],
};
const ACTIVE = new Set(["starting", "running", "verifying", "paused"]);

const state = {
  live: true, timer: null, data: null, cards: new Map(), json: new Map(),
  open: new Set(), outputs: new Map(), failures: 0,
  view: "cards", query: "", drawer: null, seen: null, flash: new Set(),
  descriptions: new Map(), results: new Map(), loading: new Set(), opened: false,
};

/* ---------- helpers ---------- */
function el(tag, props, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props || {})) {
    if (value === null || value === undefined || value === false) continue;
    if (key === "class") node.className = value;
    else if (key === "text") node.textContent = value;
    else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
    else node.setAttribute(key, value === true ? "" : value);
  }
  for (const child of children.flat()) {
    if (child === null || child === undefined || child === false) continue;
    node.append(child.nodeType ? child : document.createTextNode(String(child)));
  }
  return node;
}

function safeUrl(url) {
  try {
    const parsed = new URL(url);
    return parsed.protocol === "https:" || parsed.protocol === "http:" ? parsed.href : null;
  } catch { return null; }
}

function link(url, text) {
  const href = safeUrl(url);
  return href ? el("a", { href, target: "_blank", rel: "noopener noreferrer", text }) : text;
}

// The API sends UTC times without a zone suffix; read those as UTC, not local time.
function parseTime(iso) {
  return Date.parse(/(Z|[+-]\d\d:?\d\d)$/i.test(iso) ? iso : `${iso}Z`);
}

const fmtInt = (n) => (n ?? 0).toLocaleString("en-US");
const fmtCost = (n) => {
  if (n === null || n === undefined) return "n/a";
  if (n === 0) return "$0.00";
  return n < 0.01 ? `$${n.toFixed(4)}` : `$${n.toFixed(2)}`;
};

function fmtDuration(seconds) {
  if (seconds === null || !isFinite(seconds) || seconds < 0) return "–";
  if (seconds < 60) return `${seconds.toFixed(0)}s`;
  const m = Math.floor(seconds / 60), s = Math.round(seconds % 60);
  if (m < 60) return `${m}m ${s}s`;
  return `${Math.floor(m / 60)}h ${m % 60}m`;
}

function toast(message, kind) {
  const box = document.getElementById("toast");
  box.textContent = message;
  box.className = "show" + (kind === "info" ? " info" : "");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => { box.className = ""; }, 5000);
}

function stateBadge(map, key, extraClass) {
  const [icon, label] = map[key] || ["?", key];
  const spin = (key === "running" || key === "starting" || key === "verifying") ? " spin" : "";
  return el("span", { class: `badge st-${key} ${extraClass || ""}` },
    el("span", { class: "icon" + spin, "aria-hidden": "true", text: icon }), label);
}

/* ---------- rendering ---------- */
function renderTiles(summary) {
  const counts = summary.status_counts;
  const total = Object.values(counts).reduce((a, b) => a + b, 0);
  const tile = (label, value, sub) => el("div", { class: "tile" },
    el("div", { class: "label", text: label }),
    el("div", { class: "value", text: value }),
    el("div", { class: "sub", text: sub }));

  const active = ["starting", "running", "verifying", "paused"].reduce((s, k) => s + (counts[k] || 0), 0);
  document.getElementById("tiles").replaceChildren(
    tile("Active agents", `${summary.active_agents} / ${summary.max_concurrent_agents}`, "running now / allowed at once"),
    tile("Tasks", String(total),
      `${active} active · ${counts.queued || 0} queued · ${counts.completed || 0} completed · ${(counts.failed || 0) + (counts.cancelled || 0)} failed/cancelled`),
    tile("Tokens", `${fmtInt(summary.usage.input_tokens)} in`,
      `${fmtInt(summary.usage.output_tokens)} out · cache ${fmtInt(summary.usage.cache_read_input_tokens)} read`),
    tile("Cost", fmtCost(summary.usage.cost_usd), "reported by Claude, all listed tasks"),
  );
}

const BOARD_ORDER = ["Todo", "Queued", "Building", "Testing", "Checks", "Reviewing",
  "Fixing", "PR open", "Done", "Failed"];

function renderProjects(projects) {
  const box = document.getElementById("projects");
  box.hidden = projects.length === 0;
  box.replaceChildren(
    el("h2", { text: "Projects" }),
    ...projects.map((project) => {
      const percent = Math.round((100 * project.completed_count) / project.task_count);
      const known = BOARD_ORDER.filter((name) => project.columns[name]);
      const other = Object.keys(project.columns).filter((name) => !BOARD_ORDER.includes(name));
      return el("div", { class: "pj-row" },
        el("div", {}, el("span", { class: "name", text: project.name }),
          project.board_number ? el("span", { class: "meta", text: `  board #${project.board_number}` }) : null),
        el("div", { class: "ms-bar", role: "progressbar", "aria-valuemin": "0", "aria-valuemax": "100",
          "aria-valuenow": String(percent), "aria-label": `${project.name} progress` }, el("span", { style: `width:${percent}%` })),
        el("div", { class: "num", text: `${project.completed_count} of ${project.task_count} done`
          + (project.active_count ? ` · ${project.active_count} running` : "")
          + (project.failed_count ? ` · ${project.failed_count} failed` : "") }),
        el("div", { class: "num", text: `${fmtCost(project.usage.cost_usd)} · ${fmtInt(project.usage.input_tokens + project.usage.output_tokens)} tokens` }),
        known.length || other.length
          ? el("div", { class: "pj-cols", "aria-label": "Cards per board column" },
              [...known, ...other].map((name) => el("span", { class: "chip", text: `${name} ${project.columns[name]}` })))
          : null);
    }));
}

function syncProjectFilter(projects) {
  const select = document.getElementById("project-filter");
  const names = projects.map((project) => project.name);
  const current = select.value;
  const have = [...select.options].slice(1).map((option) => option.value);
  if (names.join("\u0000") !== have.join("\u0000")) {
    select.replaceChildren(el("option", { value: "", text: "All projects" }),
      ...names.map((name) => el("option", { value: name, text: name })));
    select.value = names.includes(current) ? current : "";
  }
}

function renderMilestones(milestones) {
  const used = milestones.filter((m) => m.task_count > 0);
  const box = document.getElementById("milestones");
  box.hidden = used.length === 0;
  box.replaceChildren(
    el("h2", { text: "Milestones" }),
    ...used.map((m) => {
      const percent = Math.round((100 * m.completed_count) / m.task_count);
      return el("div", { class: "ms-row" },
        el("div", {}, el("span", { class: "code", text: m.code }), ` ${m.title.replace(m.code, "").replace(/^[\s–-]+/, "")}`),
        el("div", { class: "ms-bar", role: "progressbar", "aria-valuemin": "0", "aria-valuemax": "100",
          "aria-valuenow": String(percent), "aria-label": `${m.code} progress` }, el("span", { style: `width:${percent}%` })),
        el("div", { class: "num", text: `${m.completed_count} of ${m.task_count} done` + (m.failed_count ? ` · ${m.failed_count} failed` : "") }),
        el("div", { class: "num", text: `${fmtCost(m.usage.cost_usd)} · ${fmtInt(m.usage.input_tokens + m.usage.output_tokens)} tokens` }));
    }));
}

function stepper(task) {
  return el("ol", { class: "stepper", "aria-label": "Pipeline progress" },
    task.stages.map((stage) => {
      const [icon, label] = STATE_TEXT[stage.state] || ["?", stage.state];
      const spin = stage.state === "running" ? " spin" : "";
      const detail = stage.name === "pull_request" && stage.detail
        ? link(stage.detail, "Open on GitHub") : stage.detail;
      return el("li", { class: `step st-${stage.state}` },
        el("div", { class: "name", text: stage.label }),
        el("div", { class: "state" },
          el("span", { class: "icon" + spin, "aria-hidden": "true", text: icon }), label),
        detail ? el("div", { class: "detail" }, detail) : null);
    }));
}

function runsTable(task) {
  if (!task.runs.length) return el("p", { class: "meta", text: "No agent runs yet." });
  return el("div", { class: "scroll" }, el("table", {},
    el("thead", {}, el("tr", {},
      ["Run", "Agent", "Model / effort", "Status"].map((h) => el("th", { text: h })),
      ["Input", "Output", "Cost"].map((h) => el("th", { class: "num", text: h })),
      el("th", { class: "num", text: "Time" }), el("th", { text: "" }))),
    el("tbody", {}, task.runs.map((run) => {
      const status = run.status.toLowerCase();
      const time = el("td", { class: "num", "data-start": run.started_at || "", "data-end": run.finished_at || "" });
      return el("tr", {},
        el("td", { text: `#${run.id}` }),
        el("td", { text: run.agent_role }),
        el("td", { text: [run.model, run.effort].filter(Boolean).join(" / ") || "–" }),
        el("td", {}, stateBadge(STATE_TEXT, { completed: "done", starting: "running" }[status] || status)),
        el("td", { class: "num", text: fmtInt(run.input_tokens) }),
        el("td", { class: "num", text: fmtInt(run.output_tokens) }),
        el("td", { class: "num", text: fmtCost(run.reported_cost_usd) }),
        time,
        el("td", {}, el("button", { type: "button", text: "Details", "aria-label": `Details of run ${run.id}`,
          onclick: () => openDrawer(task.id, run.id) })));
    }))));
}

async function showOutput(task, check, holder, button) {
  const key = `${task.id}:${check.check_name}`;
  if (!state.outputs.has(key)) {
    button.disabled = true;
    try {
      const detail = await (await fetch(`/tasks/${task.id}`)).json();
      const matches = detail.verification_results.filter((r) => r.check_name === check.check_name);
      state.outputs.set(key, matches.length ? matches[matches.length - 1].details : "(no output)");
    } catch (error) {
      toast(`Could not load output: ${error.message}`);
      button.disabled = false;
      return;
    }
    button.disabled = false;
  }
  if (holder.firstChild) { holder.replaceChildren(); button.textContent = "Show output"; return; }
  holder.replaceChildren(el("pre", { class: "output", text: state.outputs.get(key) }));
  button.textContent = "Hide output";
}

function checksList(task) {
  if (!task.checks.length) return el("p", { class: "meta", text: "Checks have not run yet." });
  return el("ul", { class: "checks" }, task.checks.map((check) => {
    const holder = el("div");
    const button = el("button", { type: "button", text: "Show output" });
    button.addEventListener("click", () => showOutput(task, check, holder, button));
    return el("li", {},
      stateBadge(STATE_TEXT, check.passed ? "done" : "failed"), " ",
      el("strong", { text: check.check_name }), " ", button, holder);
  }));
}

async function act(task, action, confirmText) {
  if (confirmText && !confirm(confirmText)) return;
  const path = action === "start" ? `/tasks/${task.id}/pipeline` : `/tasks/${task.id}/${action}`;
  try {
    const response = await fetch(path, { method: "POST" });
    const body = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(body.detail || `HTTP ${response.status}`);
    toast(body.message || `Task ${task.id}: ${action} requested`, "info");
  } catch (error) {
    toast(`Task ${task.id}: ${error.message}`);
  }
  refresh();
}

function actionButtons(task) {
  const make = (text, enabled, action, className, confirmText) =>
    el("button", {
      type: "button", class: className, disabled: !enabled, text,
      "aria-label": `${text} task ${task.id}`,
      onclick: () => act(task, action, confirmText),
    });
  return el("div", { class: "actions" },
    make("Start", task.actions.start, "start", "primary"),
    make("Pause", task.actions.pause, "pause"),
    make("Resume", task.actions.resume, "resume"),
    make("Cancel", task.actions.cancel, "cancel", "danger",
      `Cancel task ${task.id}? Its running agent will be stopped.`));
}

// Span of a task: first run start -> last run end. The end is "" while any run is unfinished,
// which tickDurations() treats as "now".
function taskSpan(runs) {
  let start = null, end = null, running = false;
  for (const run of runs) {
    const s = run.started_at ? parseTime(run.started_at) : NaN;
    if (!isNaN(s) && (start === null || s < start)) start = s;
    const f = run.finished_at ? parseTime(run.finished_at) : NaN;
    if (isNaN(f)) running = true;
    else if (end === null || f > end) end = f;
  }
  if (start === null) return { start: "", end: "" };
  return { start: new Date(start).toISOString(), end: running || end === null ? "" : new Date(end).toISOString() };
}

function renderCard(task) {
  const status = task.status;
  const span = taskSpan(task.runs);
  const usage = task.usage;
  const stageNow = task.current_stage && ACTIVE.has(status)
    ? el("span", { class: "meta", text: `stage: ${task.current_stage}` }) : null;

  const branches = task.branches.map((branch) =>
    el("span", {}, `${branch.role}: `, branch.url ? link(branch.url, branch.name) : branch.name));

  const runsDetails = el("details", { "data-section": "runs" },
    el("summary", { text: `Agent runs (${task.runs.length})` }), runsTable(task));
  const checksDetails = el("details", { "data-section": "checks" },
    el("summary", { text: `Verification checks (${task.checks.length})` }), checksList(task));
  for (const details of [runsDetails, checksDetails]) {
    const key = `${task.id}:${details.dataset.section}`;
    details.open = state.open.has(key);
    details.addEventListener("toggle", () => {
      if (details.open) state.open.add(key); else state.open.delete(key);
    });
  }

  return el("article", { class: "card" + (ACTIVE.has(status) ? " is-running" : ""), "data-task": task.id },
    el("div", { class: "card-head" },
      el("div", { class: "title" },
        el("span", { class: "id", text: `#${task.id} ` }),
        el("button", { type: "button", class: "linklike", title: "Open details", text: task.title,
          onclick: () => openDrawer(task.id) })),
      task.milestone ? el("span", { class: "chip", title: "GitHub milestone", text: task.milestone }) : null,
      task.project ? el("span", { class: "chip", title: "Project (GitHub Projects board)", text: task.project }) : null,
      task.board_column ? el("span", { class: "chip", title: "GitHub Projects board column", text: "Board: " + task.board_column }) : null,
      task.blocked_by && task.blocked_by.length
        ? el("span", { class: "chip", title: "Starts after these are merged", text: (task.status === "blocked" ? "Waiting for " : "Needed ") + task.blocked_by.join(", ") })
        : null,
      task.jira_key
        ? el("span", { class: "meta" }, task.jira_url ? link(task.jira_url, task.jira_key) : task.jira_key)
        : null,
      task.github_issue_number
        ? el("span", { class: "meta" }, task.issue_url ? link(task.issue_url, `issue #${task.github_issue_number}`) : `issue #${task.github_issue_number}`)
        : null,
      stateBadge(STATUS_TEXT, status), stageNow,
      el("button", { type: "button", class: "primary", text: "Details", "aria-label": `Details of task ${task.id}`,
        onclick: () => openDrawer(task.id) }),
      actionButtons(task)),
    stepper(task),
    el("div", { class: "facts" },
      el("span", {}, "Tokens ", el("strong", { text: `${fmtInt(usage.input_tokens)} in / ${fmtInt(usage.output_tokens)} out` })),
      el("span", {}, "Cost ", el("strong", { text: fmtCost(usage.cost_usd) })),
      el("span", {}, "Time ", el("strong", {
        class: "task-time", text: "–", "data-task-start": span.start, "data-task-end": span.end,
      })),
      branches),
    runsDetails, checksDetails);
}

function matchesFilter(task, filter) {
  const s = task.status;
  if (filter === "all") return true;
  if (filter === "active") return ACTIVE.has(s);
  if (filter === "queued") return s === "queued";
  if (filter === "blocked") return s === "blocked";
  if (filter === "completed") return s === "completed";
  return s === "failed" || s === "cancelled";
}

function render() {
  const data = state.data;
  if (!data) return;
  renderTiles(data.summary);
  renderLive(data);
  renderInsights(data);
  renderProjects(data.projects || []);
  syncProjectFilter(data.projects || []);
  renderMilestones(data.milestones);
  document.getElementById("repo").replaceChildren(
    data.repo ? link(`https://github.com/${data.repo}`, data.repo) : "");

  const syncButton = document.getElementById("sync");
  syncButton.hidden = data.milestones.length === 0;

  const visible = visibleTasks(data);
  document.getElementById("count").textContent =
    `${visible.length} of ${data.tasks.length} tasks` + (data.summary.polling_enabled ? " · auto-import on" : "");

  const container = document.getElementById("tasks");
  const board = document.getElementById("board");
  const boardView = state.view === "board";
  container.hidden = boardView;
  board.hidden = !boardView;

  if (boardView) renderBoard(visible);
  else renderCards(container, visible, data);

  drawerRender(false);
  tickDurations();
}

function renderCards(container, visible, data) {
  const keep = new Set(visible.map((task) => task.id));

  for (const [id, node] of state.cards) {
    if (!keep.has(id)) { node.remove(); state.cards.delete(id); state.json.delete(id); }
  }
  for (const stale of container.querySelectorAll(".empty")) stale.remove();

  visible.forEach((task, index) => {
    const serialized = JSON.stringify(task);
    let node = state.cards.get(task.id);
    if (!node || state.json.get(task.id) !== serialized) {
      const fresh = renderCard(task);
      if (node) node.replaceWith(fresh);
      node = fresh;
      state.cards.set(task.id, node);
      state.json.set(task.id, serialized);
      if (state.flash.has(task.id)) node.classList.add("flash");
    }
    if (container.children[index] !== node) container.insertBefore(node, container.children[index] || null);
  });
  state.flash.clear();

  if (!visible.length) {
    container.append(el("div", { class: "empty", text: data.tasks.length
      ? "No tasks match this filter."
      : "No tasks yet. Add the agent-task label to an issue on GitHub, or use Sync issues." }));
  }
}

function tickDurations() {
  const now = Date.now();
  for (const cell of document.querySelectorAll("td[data-start]")) {
    const start = cell.dataset.start ? parseTime(cell.dataset.start) : null;
    const end = cell.dataset.end ? parseTime(cell.dataset.end) : now;
    cell.textContent = start ? fmtDuration((end - start) / 1000) : "–";
  }
  for (const total of document.querySelectorAll("strong[data-task-start]")) {
    const start = total.dataset.taskStart ? parseTime(total.dataset.taskStart) : null;
    const end = total.dataset.taskEnd ? parseTime(total.dataset.taskEnd) : now;
    total.textContent = start ? fmtDuration((end - start) / 1000) : "–";
  }
  for (const node of document.querySelectorAll("[data-elapsed]")) {
    const began = parseTime(node.dataset.elapsed);
    node.textContent = isNaN(began) ? "–" : fmtDuration((now - began) / 1000);
  }
}

/* ---------- v2: search, views, live agents, insights, board, drawer ---------- */
const GROUPS = [
  { key: "blocked", label: "Waiting", statuses: ["blocked"], color: "var(--s-wait)", filter: "blocked" },
  { key: "queued", label: "Queued", statuses: ["queued"], color: "var(--s-queued)", filter: "queued" },
  { key: "working", label: "Working", statuses: ["starting", "running", "verifying", "paused"], color: "var(--s-work)", filter: "active" },
  { key: "completed", label: "Completed", statuses: ["completed"], color: "var(--s-done)", filter: "completed" },
  { key: "failed", label: "Failed / cancelled", statuses: ["failed", "cancelled"], color: "var(--s-fail)", filter: "failed" },
];
const ROLE_LETTER = { builder: "B", tester: "T", reviewer: "R" };
const RUN_ACTIVE = new Set(["STARTING", "RUNNING", "PAUSED"]);

function stored(key, fallback) {
  try { return localStorage.getItem(key) || fallback; } catch { return fallback; }
}
function store(key, value) {
  try { localStorage.setItem(key, value); } catch { /* storage can be blocked */ }
}

const shortTitle = (task) => task.title.replace(/^[A-Z][A-Z0-9]*-\d+:\s*/, "");
const taskLabel = (task) => task.jira_key || `#${task.id}`;
// Tasks that wait on others say so; once running or finished the same list is history.
const waitWord = (task) => (task.status === "blocked" ? "Waiting for" : "Needed");
const fmtWhen = (iso) => (iso ? new Date(parseTime(iso)).toLocaleString() : "–");
const runSeconds = (run) =>
  run.started_at && run.finished_at ? (parseTime(run.finished_at) - parseTime(run.started_at)) / 1000 : null;

function roundel(role) {
  return el("span", { class: `roundel ${role}`, title: role, "aria-hidden": "true", text: ROLE_LETTER[role] || "?" });
}
function elapsedSpan(iso) {
  return el("span", { class: "elapsed", "data-elapsed": iso || "", text: "–" });
}

/* ----- theme ----- */
function applyTheme(mode) {
  if (mode === "light" || mode === "dark") document.documentElement.dataset.theme = mode;
  else delete document.documentElement.dataset.theme;
  document.getElementById("theme").textContent = `Theme: ${mode}`;
}
function cycleTheme() {
  const next = { auto: "light", light: "dark", dark: "auto" }[stored("theme", "auto")] || "auto";
  store("theme", next);
  applyTheme(next);
}

/* ----- view and filters ----- */
function setView(view) {
  state.view = view;
  store("view", view);
  document.getElementById("view-cards").setAttribute("aria-pressed", String(view === "cards"));
  document.getElementById("view-board").setAttribute("aria-pressed", String(view === "board"));
  render();
}
function setFilter(value) {
  document.getElementById("filter").value = value;
  render();
}
function visibleTasks(data) {
  const filter = document.getElementById("filter").value;
  const project = document.getElementById("project-filter").value;
  const query = state.query.trim().toLowerCase();
  return data.tasks.filter((task) => {
    if (!matchesFilter(task, filter) || (project && task.project !== project)) return false;
    if (!query) return true;
    const haystack = [task.title, task.jira_key, `#${task.id}`, task.project, task.board_column, task.current_stage,
      task.status].filter(Boolean).join(" ").toLowerCase();
    return haystack.includes(query);
  });
}

/* ----- agents working now ----- */
function renderLive(data) {
  const box = document.getElementById("live-panel");
  const live = [];
  for (const task of data.tasks) {
    for (const run of task.runs) if (RUN_ACTIVE.has(run.status)) live.push({ task, run });
  }
  box.hidden = live.length === 0;
  box.replaceChildren(
    el("h2", {}, el("span", { class: "pulse", "aria-hidden": "true" }), `Agents working now (${live.length})`),
    el("div", { class: "agents-now" }, live.map(({ task, run }) =>
      el("button", {
        type: "button", class: "agent-chip", title: "Open this run",
        onclick: () => openDrawer(task.id, run.id),
      },
      roundel(run.agent_role),
      el("span", {}, el("strong", { text: taskLabel(task) }), ` ${run.agent_role}`),
      el("span", { class: "meta", text: [run.model, run.effort].filter(Boolean).join("/") }),
      run.status === "PAUSED" ? el("span", { class: "chip", text: "paused" }) : elapsedSpan(run.started_at)))));
}

/* ----- status mix and cost by agent ----- */
function renderInsights(data) {
  const counts = data.summary.status_counts;
  const total = Object.values(counts).reduce((a, b) => a + b, 0);
  const sizes = GROUPS.map((group) => group.statuses.reduce((sum, key) => sum + (counts[key] || 0), 0));

  const bar = el("div", {
    class: "statusbar", role: "img",
    "aria-label": GROUPS.map((group, i) => `${group.label} ${sizes[i]}`).join(", "),
  });
  const legend = el("div", { class: "legend" });
  GROUPS.forEach((group, i) => {
    if (sizes[i]) bar.append(el("span", { style: `flex-grow:${sizes[i]};background:${group.color}`, title: `${group.label}: ${sizes[i]}` }));
    legend.append(el("button", {
      type: "button", disabled: sizes[i] === 0, title: "Show only these tasks", onclick: () => setFilter(group.filter),
    }, el("span", { class: "swatch", style: `background:${group.color}` }), `${group.label} `, el("strong", { text: String(sizes[i]) })));
  });
  document.getElementById("status-panel").replaceChildren(
    el("h2", { text: `Task flow · ${total} task${total === 1 ? "" : "s"}` }),
    total ? bar : el("p", { class: "meta", text: "No tasks yet." }), legend);

  const roles = data.summary.roles || [];
  const top = Math.max(...roles.map((r) => r.cost_usd), 0.0001);
  document.getElementById("roles-panel").replaceChildren(
    el("h2", { text: "Cost by agent" }),
    ...(roles.length ? roles.map((role) => {
      const finished = Math.max(role.runs - role.active, 1);
      const width = Math.max(3, Math.round((100 * role.cost_usd) / top));
      return el("div", { class: "rolebar" },
        el("span", {}, roundel(role.role), " ", role.role),
        el("div", { class: "track" }, el("span", { style: `width:${width}%;background:var(--role-${role.role})` })),
        el("span", { class: "num",
          text: `${fmtCost(role.cost_usd)} · ${role.runs} run${role.runs === 1 ? "" : "s"} · avg ${fmtDuration(role.seconds / finished)}` }));
    }) : [el("p", { class: "meta", text: "No agent has run yet." })]));
}

/* ----- board view ----- */
function miniCard(task) {
  const span = taskSpan(task.runs);
  return el("button", {
    type: "button", class: "mini", "aria-label": `Open task ${task.id}`, onclick: () => openDrawer(task.id),
  },
  el("div", { class: "t" }, el("span", { class: "meta", text: `${taskLabel(task)} ` }), shortTitle(task)),
  el("div", { class: "m" },
    stateBadge(STATUS_TEXT, task.status),
    task.current_stage && ACTIVE.has(task.status) ? el("span", { text: `stage: ${task.current_stage}` }) : null,
    task.blocked_by.length && task.status === "blocked" ? el("span", { text: `waiting for ${task.blocked_by.join(", ")}` }) : null,
    el("span", {}, "Time ", el("strong", { "data-task-start": span.start, "data-task-end": span.end, text: "–" })),
    fmtCost(task.usage.cost_usd)),
  el("div", { class: "pips", "aria-hidden": "true" },
    task.stages.map((stage) => el("i", { class: `st-${stage.state}`, title: `${stage.label}: ${stage.state}` }))));
}

function renderBoard(tasks) {
  const box = document.getElementById("board");
  const signature = JSON.stringify(tasks.map((task) =>
    [task.id, task.status, task.current_stage, task.stages.map((s) => s.state), task.usage.cost_usd, task.blocked_by]));
  if (box.dataset.signature === signature) return;
  box.dataset.signature = signature;
  box.replaceChildren(...GROUPS.map((group) => {
    const items = tasks.filter((task) => group.statuses.includes(task.status));
    return el("section", { class: "lane", style: `--lane:${group.color}`, "aria-label": group.label },
      el("h3", {}, el("span", { class: "swatch", style: `background:${group.color}` }), group.label,
        el("span", { class: "count", text: String(items.length) })),
      items.length ? items.map(miniCard) : el("p", { class: "meta", text: "Nothing here." }));
  }));
}

/* ----- details drawer ----- */
function openDrawer(taskId, runId) {
  state.drawer = { taskId, runId: runId || null };
  if (runId) state.open.add(`run:${runId}`);
  document.getElementById("drawer").classList.add("open");
  document.getElementById("drawer").setAttribute("aria-hidden", "false");
  document.getElementById("backdrop").classList.add("show");
  history.replaceState(null, "", `#task-${taskId}`);
  if (!state.descriptions.has(taskId)) loadDescription(taskId);
  drawerRender(true);
  document.getElementById("drawer-close").focus();
  if (runId) {
    setTimeout(() => {
      const target = document.querySelector(`[data-run="${runId}"]`);
      if (target) target.scrollIntoView({ block: "center", behavior: "smooth" });
    }, 60);
  }
}

function closeDrawer() {
  state.drawer = null;
  document.getElementById("drawer").classList.remove("open");
  document.getElementById("drawer").setAttribute("aria-hidden", "true");
  document.getElementById("backdrop").classList.remove("show");
  history.replaceState(null, "", location.pathname + location.search);
}

async function loadDescription(taskId) {
  state.descriptions.set(taskId, "Loading…");
  try {
    const response = await fetch(`/tasks/${taskId}`);
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    state.descriptions.set(taskId, (await response.json()).description || "(no description)");
  } catch (error) {
    state.descriptions.set(taskId, `Could not load the description: ${error.message}`);
  }
  drawerRender(true);
}

async function loadResult(runId) {
  if (state.loading.has(runId)) return;
  state.loading.add(runId);
  try {
    const response = await fetch(`/dashboard/runs/${runId}`);
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    state.results.set(runId, (await response.json()).result_text || "(the agent reported no message)");
  } catch (error) {
    state.results.set(runId, `Could not load the message: ${error.message}`);
  }
  state.loading.delete(runId);
  drawerRender(true);
}

function ganttChart(task) {
  const runs = task.runs.filter((run) => run.started_at);
  if (!runs.length) return el("p", { class: "meta", text: "No agent has started yet." });
  const now = Date.now();
  const spans = runs.map((run) => [parseTime(run.started_at), run.finished_at ? parseTime(run.finished_at) : now]);
  const first = Math.min(...spans.map((s) => s[0]));
  const last = Math.max(...spans.map((s) => s[1]), first + 1000);
  const width = last - first;
  const live = runs.some((run) => !run.finished_at);
  return el("div", { class: "gantt", role: "group", "aria-label": "When each agent ran" },
    runs.map((run, i) => el("div", { class: "row" },
      el("button", {
        type: "button", class: `span ${run.agent_role}${run.finished_at ? "" : " live"}`,
        style: `left:${(100 * (spans[i][0] - first)) / width}%;width:${Math.max((100 * (spans[i][1] - spans[i][0])) / width, 1)}%`,
        title: `${run.agent_role} run #${run.id}: ${fmtDuration((spans[i][1] - spans[i][0]) / 1000)}`,
        onclick: () => openDrawer(task.id, run.id),
        text: `${run.agent_role} #${run.id}`,
      }))),
    el("div", { class: "axis" },
      el("span", { text: new Date(first).toLocaleTimeString() }),
      el("span", { text: `total ${fmtDuration(width / 1000)}` }),
      el("span", { text: live ? "now" : new Date(last).toLocaleTimeString() })));
}

function runDetails(task, run) {
  const key = `run:${run.id}`;
  const status = run.status.toLowerCase();
  const seconds = runSeconds(run);
  const fact = (label, value) => [el("dt", { text: label }), el("dd", {}, value)];
  const details = el("details", { class: "run" + (state.drawer && state.drawer.runId === run.id ? " target" : ""), "data-run": run.id },
    el("summary", {},
      roundel(run.agent_role),
      el("strong", { text: `${run.agent_role} · run #${run.id}` }),
      stateBadge(STATE_TEXT, { completed: "done", starting: "running" }[status] || status),
      el("span", { class: "grow meta", text: [run.model, run.effort].filter(Boolean).join(" / ") }),
      el("span", { class: "meta" }, run.started_at && seconds === null ? elapsedSpan(run.started_at) : fmtDuration(seconds)),
      el("span", { class: "meta", text: fmtCost(run.reported_cost_usd) })),
    el("dl", {},
      fact("Status", run.status), fact("Model", run.model || "–"), fact("Effort", run.effort || "–"),
      fact("Started", fmtWhen(run.started_at)), fact("Finished", run.finished_at ? fmtWhen(run.finished_at) : "still running"),
      fact("Duration", seconds === null ? (run.started_at ? elapsedSpan(run.started_at) : "–") : fmtDuration(seconds)),
      fact("Turns", run.num_turns ?? "–"), fact("Exit code", run.return_code ?? "–"),
      fact("Input tokens", fmtInt(run.input_tokens)), fact("Output tokens", fmtInt(run.output_tokens)),
      fact("Cache read", fmtInt(run.cache_read_input_tokens)), fact("Cache created", fmtInt(run.cache_creation_input_tokens)),
      fact("Cost", fmtCost(run.reported_cost_usd)), fact("Process ID", run.process_id ?? "–"),
      fact("Session", run.session_id || "–")),
    el("h3", { text: "Final message" }),
    resultBlock(run));
  details.open = state.open.has(key);
  details.addEventListener("toggle", () => {
    if (details.open) {
      state.open.add(key);
      if (run.has_result && !state.results.has(run.id)) loadResult(run.id);
    } else state.open.delete(key);
  });
  if (details.open && run.has_result && !state.results.has(run.id)) loadResult(run.id);
  return details;
}

function resultBlock(run) {
  if (!run.has_result) {
    return el("p", { class: "meta", text: RUN_ACTIVE.has(run.status)
      ? "The agent has not finished yet."
      : "No final message was recorded for this run." });
  }
  return state.results.has(run.id)
    ? el("pre", { class: "output", text: state.results.get(run.id) })
    : el("p", { class: "meta", text: "Loading…" });
}

function drawerSections(task) {
  const span = taskSpan(task.runs);
  const usage = task.usage;
  const byLabel = new Map(state.data.tasks.map((other) => [taskLabel(other), other]));

  const waiting = task.blocked_by.map((entry) => {
    const other = byLabel.get(entry);
    return other
      ? el("button", { type: "button", class: "chip", title: "Open this task", onclick: () => openDrawer(other.id), text: `${waitWord(task)} ${entry}` })
      : el("span", { class: "chip", text: `${waitWord(task)} ${entry}` });
  });

  return [
    el("div", { class: "chips" },
      stateBadge(STATUS_TEXT, task.status),
      task.current_stage && ACTIVE.has(task.status) ? el("span", { class: "meta", text: `stage: ${task.current_stage}` }) : null,
      task.project ? el("span", { class: "chip", text: task.project }) : null,
      task.board_column ? el("span", { class: "chip", text: `Board: ${task.board_column}` }) : null,
      waiting,
      task.jira_key ? el("span", { class: "meta" }, task.jira_url ? link(task.jira_url, task.jira_key) : task.jira_key) : null,
      task.github_issue_number ? el("span", { class: "meta" }, task.issue_url ? link(task.issue_url, `issue #${task.github_issue_number}`) : `issue #${task.github_issue_number}`) : null,
      task.pull_request_url ? el("span", { class: "meta" }, link(task.pull_request_url, "Pull request")) : null),
    el("div", { style: "margin: 10px 0" }, actionButtons(task)),
    el("div", { class: "facts" },
      el("span", {}, "Tokens ", el("strong", { text: `${fmtInt(usage.input_tokens)} in / ${fmtInt(usage.output_tokens)} out` })),
      el("span", {}, "Cache ", el("strong", { text: `${fmtInt(usage.cache_read_input_tokens)} read / ${fmtInt(usage.cache_creation_input_tokens)} created` })),
      el("span", {}, "Cost ", el("strong", { text: fmtCost(usage.cost_usd) })),
      el("span", {}, "Time ", el("strong", { "data-task-start": span.start, "data-task-end": span.end, text: "–" })),
      task.branches.map((branch) => el("span", {}, `${branch.role}: `, branch.url ? link(branch.url, branch.name) : branch.name))),
    el("h3", { text: "Pipeline" }), stepper(task),
    el("h3", { text: "Timeline" }), ganttChart(task),
    el("h3", { text: `Agent runs (${task.runs.length})` }),
    task.runs.length ? task.runs.map((run) => runDetails(task, run)) : el("p", { class: "meta", text: "No agent runs yet." }),
    el("h3", { text: `Verification checks (${task.checks.length})` }), checksList(task),
    el("h3", { text: "Task description" }),
    el("div", { class: "desc", text: state.descriptions.get(task.id) || "Loading…" }),
    el("p", { class: "hint" }, "Press ", el("kbd", { text: "Esc" }), " to close."),
  ];
}

function drawerRender(force) {
  const drawer = state.drawer;
  if (!drawer || !state.data) return;
  const task = state.data.tasks.find((candidate) => candidate.id === drawer.taskId);
  const body = document.getElementById("drawer-body");
  if (!task) {
    body.replaceChildren(el("p", { class: "meta", text: "This task is not in the current overview." }));
    return;
  }
  const running = task.runs.some((run) => RUN_ACTIVE.has(run.status));
  const signature = JSON.stringify([task, drawer.runId, state.descriptions.get(task.id), state.results.size,
    running ? Math.floor(Date.now() / 5000) : 0]);
  if (!force && body.dataset.signature === signature) return;
  body.dataset.signature = signature;
  const top = body.scrollTop;
  document.getElementById("drawer-title").textContent = `${taskLabel(task)} · ${shortTitle(task)}`;
  body.replaceChildren(...drawerSections(task).flat());
  body.scrollTop = top;
  tickDurations();
}

/* ----- what changed since the last snapshot ----- */
function detectChanges(data) {
  const next = new Map(data.tasks.map((task) => [task.id, `${task.status}|${task.current_stage || ""}`]));
  if (state.seen) {
    const notes = [];
    for (const task of data.tasks) {
      const before = state.seen.get(task.id);
      if (before === next.get(task.id)) continue;
      const stage = task.current_stage && ACTIVE.has(task.status) ? ` · ${task.current_stage}` : "";
      notes.push(before === undefined
        ? `${taskLabel(task)} added`
        : `${taskLabel(task)}: ${(STATUS_TEXT[task.status] || [0, task.status])[1]}${stage}`);
      state.flash.add(task.id);
    }
    if (notes.length) toast(notes.slice(0, 3).join("  ·  ") + (notes.length > 3 ? `  (+${notes.length - 3} more)` : ""), "info");
  }
  state.seen = next;
}

/* ---------- data loading ---------- */
function setLive(kind, text) {
  document.getElementById("live-dot").className = "dot" + (kind ? ` ${kind}` : "");
  document.getElementById("live-text").textContent = text;
}

async function refresh() {
  try {
    const response = await fetch("/dashboard/overview", { cache: "no-store" });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    state.data = await response.json();
    state.failures = 0;
    detectChanges(state.data);
    render();
    openFromHash();
    setLive(state.live ? "" : "paused",
      state.live ? `Live · updated ${new Date().toLocaleTimeString()}` : "Updates paused");
  } catch (error) {
    state.failures += 1;
    setLive("stale", `Disconnected (${error.message}) – retrying`);
  }
}

function schedule() {
  clearInterval(state.timer);
  if (state.live) state.timer = setInterval(() => { if (!document.hidden) refresh(); }, POLL_MS);
}

document.getElementById("toggle-live").addEventListener("click", (event) => {
  state.live = !state.live;
  event.target.textContent = state.live ? "Pause updates" : "Resume updates";
  setLive(state.live ? "" : "paused", state.live ? "Live" : "Updates paused");
  schedule();
  if (state.live) refresh();
});

document.getElementById("filter").addEventListener("change", render);
document.getElementById("project-filter").addEventListener("change", render);

document.getElementById("sync").addEventListener("click", async (event) => {
  const button = event.target;
  button.disabled = true;
  try {
    let imported = 0, skipped = 0;
    // Issues are routed to their own milestone, so syncing through one is enough.
    for (const milestone of state.data.milestones.slice(0, 1)) {
      const response = await fetch(`/milestones/${milestone.id}/sync`, { method: "POST" });
      const body = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(body.detail || `HTTP ${response.status}`);
      imported += body.imported.length;
      skipped += body.skipped_issue_numbers.length;
    }
    toast(`Imported ${imported} new issue(s), ${skipped} already known.`, "info");
  } catch (error) {
    toast(`Sync failed: ${error.message}`);
  }
  button.disabled = false;
  refresh();
});

document.getElementById("search").addEventListener("input", (event) => {
  state.query = event.target.value;
  render();
});
document.getElementById("view-cards").addEventListener("click", () => setView("cards"));
document.getElementById("view-board").addEventListener("click", () => setView("board"));
document.getElementById("theme").addEventListener("click", cycleTheme);
document.getElementById("drawer-close").addEventListener("click", closeDrawer);
document.getElementById("backdrop").addEventListener("click", closeDrawer);

document.addEventListener("keydown", (event) => {
  const active = document.activeElement;
  const typing = active && /^(INPUT|SELECT|TEXTAREA)$/.test(active.tagName);
  if (event.key === "Escape") {
    if (state.drawer) closeDrawer();
    else if (typing) active.blur();
  } else if (event.key === "/" && !typing) {
    event.preventDefault();
    document.getElementById("search").focus();
  }
});

function openFromHash() {
  if (state.opened) return;
  state.opened = true;
  const match = /^#task-(\d+)$/.exec(location.hash);
  if (match) openDrawer(Number(match[1]));
}

{
  const forced = new URLSearchParams(location.search).get("theme");
  applyTheme(forced === "dark" || forced === "light" ? forced : stored("theme", "auto"));
  // ?view=board or ?view=cards overrides the remembered view.
  const asked = new URLSearchParams(location.search).get("view") || stored("view", "cards");
  setView(asked === "board" ? "board" : "cards");
}

setInterval(tickDurations, 1000);
setInterval(() => drawerRender(false), 5000);
refresh();
schedule();
</script>
</body>
